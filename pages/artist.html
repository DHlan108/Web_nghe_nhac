<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>My Music</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/component.css" />
    <link rel="stylesheet" href="../css/song.css" />
    <link rel="stylesheet" href="../css/album.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="layout">
      <!-- SIDEBAR -->
      <div id="sidebar-container"></div>

      <!-- MAIN -->
      <div class="main">
        <!-- HEADER -->
        <div id="navbar-container"></div>

        <!-- CONTENT -->
        <main class="content">
          <section id="product1" class="section-p1">
              <h2>Nghệ Sĩ</h2>
              <div class="artist-wrapper">
                  <button class="scroll-btn left" id="artist-btn-left"><i class="fa-solid fa-chevron-left"></i></button>
                  
                  <div class="pro-container" id="artist-container">
                      </div>

                  <button class="scroll-btn right" id="artist-btn-right"><i class="fa-solid fa-chevron-right"></i></button>
              </div>
          </section>

          <section class="section-p1 song-section"> 
            <h2 id="artist-name"></h2>
            <div class="pro-container" id="song-container"></div>
          </section>
            <div class="artist-play">
              <i class="fa-solid fa-play"></i>
            </div>
        </main>
      </div>
    </div>
    <!-- PLAYER -->
    <div id="player-container"></div>
    <script src="../js/loadComponent.js"></script>
    <script src="../js/search.js"></script>
    <script src="../js/loadArtist.js"></script>

    <!-- nghe_si -->
     <div id="artist-admin-modal" class="admin-modal">
    <div class="admin-modal-content">
        <div class="admin-modal-header">
            <h2 id="admin-artist-modal-title" style="color: white;">Quản Lý Nghệ Sĩ</h2>
            <span onclick="document.getElementById('artist-admin-modal').style.display='none'" style="cursor: pointer; color: white; font-size: 24px;">&times;</span>
        </div>
        <div class="admin-modal-body">
            <div class="input-group">
                <label>Tên Nghệ Sĩ</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="adm-artist-name">
                </div>
            </div>
            <div class="input-group">
                <label>Quốc gia</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-earth-americas"></i>
                    <input type="text" id="adm-artist-country">
                </div>
            </div>
            <div class="input-group">
                <label>Ảnh đại diện (tên file trong /img)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-image"></i>
                    <input type="text" id="adm-artist-avatar">
                </div>
            </div>
        </div>
        <div class="admin-modal-footer">
            <button class="btn-submit" onclick="submitArtist()" style="width: 100%;">Lưu Nghệ Sĩ</button>
        </div>
        </div>
        </div>
  </body>
</html>
