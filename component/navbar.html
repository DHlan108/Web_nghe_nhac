<link rel="stylesheet" href="../css/notification.css">
<section id="header">
  <a href="#"><img src="../img/logo.jpg" class="logo" /></a>

  <div class="search-box">
    <input type="text" placeholder="Tìm bài hát, nghệ sĩ..." />
    <button>
      <i class="fa-solid fa-search"></i>
    </button>
  </div>

  <!-- 🔔 ICON CHUÔNG -->
  <div class="notification-wrapper">
    <i class="fa-solid fa-bell" id="bell-icon"></i>

    <!-- POPUP FORM -->
    <div class="notification-popup" id="notification-popup">
      <form id="form">
        <input type="text" name="title" placeholder="Tiêu đề" required>
        <textarea name="content" placeholder="Nội dung" required></textarea>
        <button type="submit">Gửi</button>
      </form>
    </div>
  </div>

  <button class="logout" id="logout-btn">
    <i class="fa-solid fa-right-from-bracket"></i>
  </button>
</section>
