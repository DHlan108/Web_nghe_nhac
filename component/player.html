<div class="player-footer" style="position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: linear-gradient(90deg, #7303c0, #ec38bc); display: flex; align-items: center; z-index: 10000; color: white; box-shadow: 0 -5px 15px rgba(0,0,0,0.3); padding: 0 20px; box-sizing: border-box;">
    <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1300px; margin: 0 auto; gap: 30px;">
        
        <div style="display: flex; align-items: center; flex: 0.8; min-width: 180px;">
            <img src="" id="player-img" alt="Cover" style="width: 45px !important; height: 45px !important; border-radius: 4px; object-fit: cover; border: 1px solid rgba(255,255,255,0.3);">
            <div style="margin-left: 12px; overflow: hidden;">
                <h4 id="player-title" style="margin: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Tên bài hát</h4>
                <p id="player-artist" style="margin: 0; font-size: 11px; opacity: 0.8;">Nghệ sĩ</p>
            </div>
        </div>
        
        <div style="flex: 3; display: flex; align-items: center; gap: 20px;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <button id="prev-btn" style="background:none; border:none; color:white; cursor:pointer; font-size: 16px;"><i class="fas fa-step-backward"></i></button>
                <button id="play-btn" class="btn-toggle-play" style="background:none; border:none; color:white; cursor:pointer; font-size: 22px;"><i class="fas fa-play"></i></button>
                <button id="next-btn" style="background:none; border:none; color:white; cursor:pointer; font-size: 16px;"><i class="fas fa-step-forward"></i></button>
            </div>
            <input type="range" id="progress-bar" style="flex: 1; height: 4px; cursor: pointer; accent-color: #fff;" value="0" max="100">
        </div>

        <div style="flex: 0.5; display: flex; justify-content: flex-end; align-items: center; gap: 10px;">
            <i class="fas fa-volume-up" style="font-size: 14px;"></i>
            <input type="range" id="volume-bar" style="width: 70px; height: 4px; accent-color: #fff;" value="100" max="100">
        </div>
    </div>
    <audio id="main-audio" src=""></audio>
</div>
